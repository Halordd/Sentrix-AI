server {
    listen 10.20.10.10:443 ssl;
    server_name sentrix-app;

    ssl_certificate     /etc/nginx/ssl/sentrix.crt;
    ssl_certificate_key /etc/nginx/ssl/sentrix.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/sentrix;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never serve dotfiles, traversal forms, backups, or recovery artifacts.
    location ~ /\. { deny all; }
    location ~ \.\. { deny all; }
    location ~* \.(env|bak|dump|sql)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
