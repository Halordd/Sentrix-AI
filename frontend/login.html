<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENTRIX · Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .login-card { width: min(420px, 100%); border: 1px solid #243245; border-radius: 18px; padding: 28px; background: #0d1623; }
      .login-card h1 { margin: 8px 0 6px; }
      .login-card p { color: #94a3b8; }
      .login-card label { display: grid; gap: 6px; margin: 16px 0; color: #cbd5e1; }
      .login-card input { padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0a111b; color: #e2e8f0; }
      .login-card button { width: 100%; margin-top: 8px; }
      .login-error { color: #f87171; min-height: 20px; }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <span class="eyebrow cyan">LOCAL DEMO</span>
        <h1>SENTRIX</h1>
        <p>Sign in to the local SENTRIX console.</p>
        <form id="login-form">
          <label>Email<input name="email" type="email" value="maya@sentrix.local" required autocomplete="username" /></label>
          <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
          <p class="login-error" id="login-error"></p>
          <button class="primary" type="submit">Sign in</button>
        </form>
      </section>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const error = document.querySelector("#login-error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        const input = Object.fromEntries(new FormData(form));
        try {
          const response = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(input),
          });
          if (!response.ok) throw new Error("Invalid email or password.");
          const result = await response.json();
          localStorage.setItem("sentrix_token", result.token);
          localStorage.setItem("sentrix_user", JSON.stringify(result.user));
          window.location.replace("/");
        } catch (problem) {
          error.textContent = problem.message;
        }
      });
    </script>
  </body>
</html>
